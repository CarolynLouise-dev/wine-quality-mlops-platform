name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY, UNIT TESTS & ML EXPERIMENT MATRIX
  # ============================================================================
  test:
    name: Code Quality & Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ api/ evidently_service/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 src/ api/ evidently_service/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --disable-warnings

      - name: Execute MLflow 10-Experiment Matrix
        run: |
          python scripts/run_experiments.py

      - name: Upload Experiment Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-matrix-results
          path: data/processed/experiment_results.csv
          if-no-files-found: ignore

  # ============================================================================
  # JOB 2: DOCKER CONTAINER BUILDS
  # ============================================================================
  build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Serving Image
        run: |
          docker build -t wine-mlops-api:latest -f api/Dockerfile api/

      - name: Build Evidently Drift Image
        run: |
          docker build -t wine-mlops-drift:latest -f evidently_service/Dockerfile evidently_service/

  # ============================================================================
  # JOB 3: SMOKE TEST & DEPLOYMENT HEALTHCHECK
  # ============================================================================
  smoke-test:
    name: Smoke Test & Deployment Health
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Start API Container
        run: |
          docker build -t wine-mlops-api:latest -f api/Dockerfile api/
          docker run -d --name wine-mlops-api -p 8000:8000 wine-mlops-api:latest

      - name: Poll Health Endpoint
        run: |
          echo "Waiting for API service to become healthy..."
          sleep 4
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" == "200" ]; then
              echo "✓ API Healthcheck Passed (HTTP 200)!"
              curl -s http://localhost:8000/health
              echo ""
              exit 0
            fi
            echo "Waiting for health check... retry $i"
            sleep 2
          done
          echo "Health check timed out!"
          docker logs wine-mlops-api
          exit 1

      - name: Execute Sample Prediction
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [7.4, 0.70, 0.00, 1.9, 0.076, 11.0, 34.0, 0.9978, 3.51, 0.56, 9.4]}')
          echo "Prediction Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "prediction" || exit 1

      - name: Verify Prometheus Metrics Endpoint
        run: |
          curl -s http://localhost:8000/metrics | grep -q "model_predictions_total"
          echo "✓ Prometheus metrics endpoint successfully exposed and tracked!"

      - name: Cleanup Test Container
        if: always()
        run: |
          docker stop wine-mlops-api || true
          docker rm wine-mlops-api || true
