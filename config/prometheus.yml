global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'ml-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'wine-quality-api'
          env: 'production'

  - job_name: 'evidently'
    scrape_interval: 10s
    static_configs:
      - targets: ['evidently:8001']
        labels:
          service: 'drift-detector'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
